# DRAFT track-year submission specs (Laura's implementation of the organizers' specs).
# YAML-serializable: sentence_type tags resolve to sentence classes at load time.
# Keyed by track-year id (matches datasets.yml track:). The task field here is the
# pipeline sub-task (generation/repgen), NOT the cosmetic RAGTIME metadata.task field.
#
# Field notes:
#   sentence_type       - LIST of accepted citation representations; first is canonical for
#                         emit, all are accepted for verify. Tags rag24, ragtime, neuclir
#                         (rag24 = int indices, ragtime = doc-id to score map, neuclir =
#                         doc-id list). A track may accept several; rag25 accepts rag24 and
#                         neuclir. A bare scalar is coerced to a 1-element list.
#   sentences_key       - top-level key holding the sentence list on the wire (answer/responses)
#   topic_id_field      - metadata key carrying the topic id (narrative_id/topic_id)
#   mandatory_metadata  - keys that must be present and non-empty. id fields may be str OR int.
#   recommended_metadata - keys the track names but whose absence is only advisory; an
#                         absent/empty one reports category metadata_recommended.
#   forbid_extra_metadata   - if true, allowed keys equal mandatory_metadata exactly (no extras)
#   require_exact_narrative - if true, metadata.narrative must exactly copy the topic text
#                         (a report-by-topics cross-check; RAG only)
#   references_kind     - cited_only (refs equal the set of cited), retrieval_list (refs is the
#                         retrieval ranking, cited is a subset, len at most references_max),
#                         none (no references field; citations are self-contained doc-ids), or
#                         ignore (references array not checked at all)
#   references_optional - if true, absent/empty references pass; only a non-empty array is
#                         held to references_kind (RAGTIME: references are optional)
#   smells              - finding categories treated as WARNINGS (printed, not a failure)
#                         rather than hard errors. Unspecified -> DEFAULT_SMELLS
#                         (empty_answer, blank_sentence, duplicate_topics); `smells: []`
#                         makes every check a hard error. Categories: empty_answer,
#                         blank_sentence, citation_format, citation_count, reference_index,
#                         citation_score, docid_pattern, references_present, references_missing,
#                         references_duplicate, references_undeclared, references_uncited,
#                         references_max, metadata, metadata_recommended, run_id_length,
#                         length, duplicate_topics, missing_topics, new_topics, narrative.
#   length              - length_limit (fixed) XOR length_limit_request_field (Request field).
#                         Unit picks the counter: words = worst-case NFKC/split, chars = NFKC chars.
#   docid_pattern       - regex the citation/reference doc-ids must match (null = skip)

specs:

  rag26:                                 # CONFIRMED against trec-rag-skills references/rag-task.md
    track: rag26
    task: generation
    sentence_type: [rag24, neuclir]      # int indices OR doc-id strings (organizers confirmed 2026-07-19). Emit rag24.
    sentences_key: answer
    topic_id_field: narrative_id
    mandatory_metadata: [team_id, narrative_id, narrative, run_id, run_desc]
    forbid_extra_metadata: false         # rag-task.md: metadata "may also contain any
                                         # additional participant-defined fields"
    require_exact_narrative: true
    run_id_max_len: 20                 #  # " A-Z, a-z, 0-9, -, _, or ., but cannot begin with a period."
    docid_pattern: 'shard_\d+_\d+'        # ClimbMix, e.g. shard_00459_61697
    collection_ids: [climbmix-400b]      # informational; forbidden as a metadata key
    references_kind: retrieval_list      # rag-task.md: references is REQUIRED and MAY include uncited docs ("Uncited entries do not hurt the score"), but every CITED doc (by integer index OR doc-id string) must match an entry in references. Empty [] is valid only when nothing is cited (empty cited-set is trivially a subset).
    references_max: null
    max_citations_per_sentence: 3        # 0-3 citations per answer object; an empty citations array is explicitly permitted (no minimum)
    length_unit: words
    length_limit: 1024
    length_limit_request_field: null
    # length is a HARD reject (rag-task.md: "hard rejection criterion",
    # sum(len(item["text"].split())) <= 1024) -> NOT a smell.
    # Duplicate references are contract-silent (rag-task.md neither prohibits nor
    # allows them) -> kept as a smell (warn, do not fail).
    # citation_count is a smell (#4; organizers confirmed 2026-08-07: they judge only
    # the first three citations but accept more).
    # references_uncited: a retrieval list MAY carry uncited docs, but organizers
    # suggest not to -> smell. missing_topics: organizers accept answer=[] and also a
    # fully absent topic entry -> smell (duplicate topics stay a hard error).
    smells: [empty_answer, references_duplicate, references_uncited, citation_count, missing_topics]

  rag25:                                 # CONFIRMED against TREC RAG 2025 track guidelines
    track: rag25
    task: generation
    sentence_type: [rag24, neuclir]      # Format 1 int indices OR Format 2 doc-id strings. Emit rag24.
    sentences_key: answer
    topic_id_field: narrative_id
    mandatory_metadata: [team_id, run_id, type, narrative_id, narrative]   # prompt optional; narrative_id may be int
    forbid_extra_metadata: false         # prompt (optional) and other extras tolerated
    require_exact_narrative: true
    run_id_max_len: null
    docid_pattern: 'msmarco_v2\.1_doc_\d\d_\d+#\d+_\d+'
    collection_ids: [msmarco_v2.1_doc_segmented]
    references_kind: retrieval_list      # references = top-k retrieval list (cited is a subset)
    references_max: 100
    max_citations_per_sentence: null     # no per-sentence cap in the 2025 guidelines
    length_unit: words
    length_limit: 400
    length_limit_request_field: null
    # length: "less than 400 words" with no rejection language, and this spec mostly
    # checks participant runs the organizers already accepted -> smell.
    smells: [empty_answer, references_duplicate, references_uncited, length]

  rag25-autojudge:                       # auto-judge round-trip of rag25 runs (relaxed rag25)
    track: rag25-autojudge
    task: generation
    sentence_type: [ragtime, rag24, neuclir]   # the round-trip re-emits citations as ragtime; accept all
    sentences_key: answer
    topic_id_field: narrative_id
    mandatory_metadata: [team_id, run_id, narrative_id]   # narrative & type are dropped by the round-trip
    forbid_extra_metadata: false         # is_ragtime/documents/task/request_id extras tolerated
    require_exact_narrative: false       # no narrative field survives the round-trip
    run_id_max_len: null
    docid_pattern: 'msmarco_v2\.1_doc_\d\d_\d+#\d+_\d+'   # cited doc-ids are still MS MARCO segments
    collection_ids: [msmarco_v2.1_doc_segmented]
    references_kind: ignore              # references array is not enforced (no cited-set / 100-cap check)
    references_max: null
    max_citations_per_sentence: null     # cap-free, like rag25
    length_unit: words
    length_limit: 400
    length_limit_request_field: null
    # over-length is advisory for the round-trip format (organizers truncate, not reject)
    smells: [empty_answer, blank_sentence, duplicate_topics, references_duplicate, references_uncited, length]


  ragtime25:                             # from RAGTIME 2025 guidelines
    track: ragtime25
    task: repgen
    sentence_type: [ragtime, neuclir]    # doc_id:score dict OR plain doc-id list. Emit ragtime.
    sentences_key: responses
    topic_id_field: topic_id
    mandatory_metadata: [team_id, topic_id, run_id]
    # RELAXED relative to ragtime26 (Laura, 2026-08-07): this spec's practical role is
    # checking runs NIST already accepted in 2025 -- 38% of them lack the strict
    # reference contract, and 835 lack metadata.task. So: task is recommended (absence
    # warns), and absent/incomplete references warn. An UNCITED reference entry stays
    # a hard error in both ragtime years.
    recommended_metadata: [task]         # value cosmetic (multilingual or english)
    forbid_extra_metadata: false
    require_exact_narrative: false       # no narrative field in output
    run_id_max_len: 25                   # per the ragtime26 guideline; assumed same in 2025
    docid_pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_\d+'  # NeuCLIR uuid_segment
    collection_ids: [ragtime/1/all, ragtime/1/eng]
    references_kind: cited_only
    references_optional: false
    references_max: null
    max_citations_per_sentence: 3
    length_unit: chars
    length_limit: null
    length_limit_request_field: limit    # per-request Request.limit (NFKC chars)
    smells: [empty_answer, blank_sentence, duplicate_topics, references_duplicate, references_missing, references_undeclared, metadata_recommended, citation_count, length]

  ragtime26:                             # from RAGTIME 2026 guidelines
    track: ragtime26
    task: repgen
    sentence_type: [ragtime, neuclir]    # doc_id:score dict OR plain doc-id list. Emit ragtime.
    sentences_key: responses
    topic_id_field: topic_id
    mandatory_metadata: [team_id, topic_id, run_id]   # task dropped
    # run_desc is in the guideline's metadata block but with no guidance on content
    # (Laura, 2026-08-07) -> absent run_desc is only a smell (metadata_recommended).
    recommended_metadata: [run_desc]
    forbid_extra_metadata: false
    require_exact_narrative: false
    run_id_max_len: 20                   # " A-Z, a-z, 0-9, -, _, or ., but cannot begin with a period."
    docid_pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_\d+'
    collection_ids: [ragtime/2/all,ragtime/2/eng]
    # Organizer decision (2026-08-07, via Laura): NO checks on the references field
    # whatsoever -- absent, empty, or mismatched all pass. Supersedes the earlier
    # REQUIRED-and-exact reading. Cited doc-ids are still pattern-checked, and the
    # 3-citations-per-sentence cap stays as a SMELL.
    references_kind: ignore
    references_optional: true
    references_max: null
    max_citations_per_sentence: 3
    # length stays a smell: overlength is truncated before scoring, not rejected.
    length_unit: chars
    length_limit: null
    length_limit_request_field: limit
    smells: [empty_answer, blank_sentence, duplicate_topics, citation_count, metadata_recommended, length]

  dragun25:                              # from DRAGUN 2025 guidelines (Task 2: Report Generation)
    track: dragun25
    task: repgen
    sentence_type: [neuclir]             # citations = list of doc-id strings; no references field
    sentences_key: responses
    topic_id_field: topic_id             # topic_id is itself a MS MARCO document id (the news article)
    mandatory_metadata: [team_id, run_id, topic_id, type, use_starter_kit]
    forbid_extra_metadata: false
    require_exact_narrative: false
    run_id_max_len: null
    docid_pattern: 'msmarco_v2\.1_doc_\d\d_\d+#\d+_\d+'
    collection_ids: [msmarco_v2.1_doc_segmented]
    references_kind: ignore                # no references lptional
    references_max: null
    max_citations_per_sentence: 3
    length_unit: words
    length_limit: 250
    length_limit_request_field: null
    # citation_count as smell (#4): over-limit sentences are accepted but unjudged.
    smells: [empty_answer, missing_topics, blank_sentence, duplicate_topics, references_duplicate, references_present, new_topics, citation_count]

  kiddie:                                # synthetic smoke-test dataset (starterkits)
    track: kiddie
    task: repgen
    sentence_type: [neuclir]             # citations are doc-id-string lists
    sentences_key: responses
    topic_id_field: topic_id
    mandatory_metadata: [team_id, run_id, topic_id]
    forbid_extra_metadata: false
    require_exact_narrative: false
    run_id_max_len: null
    docid_pattern: null                  # kiddie corpus uses arbitrary ids (e.g. Wikipedia titles) - do not constrain
    collection_ids: null
    references_kind: ignore                # references optional
    references_max: null
    max_citations_per_sentence: null
    length_unit: words
    length_limit: null
    length_limit_request_field: null
