[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autojudge-base"
version = "0.4.1.dev0"
description = "Core infrastructure for implementing TREC AutoJudge systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TREC AutoJudge Team"}
]
keywords = ["trec", "autojudge", "rag", "evaluation", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "ir-datasets>=0.5",
    "nltk>=3.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tira",
    "trectools",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "griffe-pydantic>=1.0",
]
all = [
    "autojudge-base[test,docs]",
]

[project.scripts]
auto-judge = "autojudge_base.cli:main"
auto-judge-report = "autojudge_base.report_tool:main"

[project.urls]
Homepage = "https://github.com/trec-auto-judge/auto-judge-base"
Repository = "https://github.com/trec-auto-judge/auto-judge-base"
Documentation = "https://trec-auto-judge.github.io/auto-judge-base/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# ship data files (e.g. track_specs.yml, loaded at import by track_spec.py) in the wheel
autojudge_base = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
