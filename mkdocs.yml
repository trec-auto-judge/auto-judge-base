site_name: auto-judge-base API
site_description: API reference for the TREC AutoJudge core library (protocols, data models, workflow)
site_url: https://trec-auto-judge.github.io/auto-judge-base/
repo_url: https://github.com/trec-auto-judge/auto-judge-base
repo_name: trec-auto-judge/auto-judge-base
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - griffe_pydantic: { schema: false }
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: true
            show_if_no_docstring: true       # pydantic fields carry no docstrings; list them anyway
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv

markdown_extensions:
  - admonition
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - API reference:
      - Data models: api/data-models.md
      - Nuggets: api/nuggets.md
      - Leaderboard: api/leaderboard.md
      - Qrels: api/qrels.md
      - Config & protocol: api/config.md
